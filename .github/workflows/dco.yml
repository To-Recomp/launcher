name: DCO
on:
  pull_request:
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The release pull request (release-please.yml) is written by the Actions bot, which can't
      # sign off; the maintainer adds the Signed-off-by line to the squash commit when merging it.
      # Only that bot's pull requests are skipped: the author can't be chosen by a contributor.
      - name: Check Signed-off-by on every commit
        if: github.event.pull_request.user.login != 'github-actions[bot]'
        run: |
          fail=0
          for c in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              echo "Missing Signed-off-by: $c"
              fail=1
            fi
          done
          exit $fail
