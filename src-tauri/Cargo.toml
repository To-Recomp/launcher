[package]
name = "to-recomp-launcher"
version = "0.1.0"
description = "To Recomp Launcher"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
name = "to_recomp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Self-update; only the release workflow enables it, because it needs the maintainer's
# signing public key (see docs/releasing.md).
updater = ["dep:tauri-plugin-updater", "dep:reqwest"]

[dependencies]
dirs = "7.0.0"
flate2 = "1.1.11"
fs4 = "1.1.0"
jsonschema = { version = "0.33.0", default-features = false }
regex = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10.9"
tar = "0.4.46"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["socks"], optional = true }
toml_edit = "0.25.5"
ureq = { version = "3", features = ["json", "socks-proxy", "win-system-proxy"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[profile.release]
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# The default Linux tray backend (libappindicator) can't report a click on the icon. KSNI can, so the
# left click shows the window; with both enabled tray-icon uses KSNI (and prints a build warning).
[target."cfg(target_os = \"linux\")".dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
